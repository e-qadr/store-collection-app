<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>تحديث إدارة الأصالة</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf6ec; color: #244f4d; font-family: Tahoma, Arial, sans-serif; }
    main { max-width: 360px; padding: 32px; margin: 24px; text-align: center; background: #fff; border-radius: 22px; box-shadow: 0 10px 35px #244f4d18; }
    .mark { font-size: 42px; } h1 { font-size: 21px; } p { color: #68716d; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <div class="mark">↻</div>
    <h1>جارٍ تحديث التطبيق</h1>
    <p>يتم تجهيز أحدث نسخة من الواجهة. ستعود إلى التطبيق تلقائياً.</p>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((name) => caches.delete(name)));
        }
      } finally {
        window.setTimeout(() => window.location.replace('/?updated=1'), 700);
      }
    })();
  </script>
</body>
</html>
