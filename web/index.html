<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="نظام إدارة تحصيل الكاشير وسندات الفروع">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="تحصيل الكاشير">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>إدارة الأصالة</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // The deployment identifier changes for every web publish.  It lets an
    // already-open browser tab refresh itself once a newer web build exists.
    window.__storeCollectionRelease = '{{WEB_RELEASE_ID}}';
    (() => {
      const release = window.__storeCollectionRelease;
      if (!release || release.includes('{{')) return;

      let checking = false;
      const checkForNewRelease = async () => {
        if (checking) return;
        checking = true;
        try {
          const response = await fetch(`deployment.json?t=${Date.now()}`, {
            cache: 'no-store',
          });
          if (!response.ok) return;
          const deployed = await response.json();
          if (deployed.release && deployed.release !== release) {
            window.location.reload();
          }
        } catch (_) {
          // A temporary offline state must not interrupt the user.
        } finally {
          checking = false;
        }
      };

      window.addEventListener('focus', checkForNewRelease);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkForNewRelease();
      });
      window.setInterval(checkForNewRelease, 5 * 60 * 1000);
    })();
  </script>
  <script src="flutter_bootstrap.js?build={{WEB_RELEASE_ID}}" async></script>
</body>
</html>
