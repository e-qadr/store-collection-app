name: Deploy web application

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    # GitHub OIDC exchanges a short-lived identity with Firebase; no deploy
    # token or service-account key is kept in this repository. The IAM
    # Credentials and Security Token Service APIs are enabled in the project.
    env:
      AUTH_API_BASE_URL: https://collection-api.alasalh.com
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: >-
          flutter build web --release
          --dart-define=AUTH_API_BASE_URL=${{ env.AUTH_API_BASE_URL }}
          --web-define=WEB_RELEASE_ID=${{ github.sha }}
      - name: Write deployment revision
        shell: bash
        run: |
          printf '{"release":"%s"}\n' "${GITHUB_SHA}" > build/web/deployment.json
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/385756153909/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-deployer@store-collection-app.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Deploy to Firebase Hosting
        shell: bash
        run: |
          set +e
          deploy_output="$(npx firebase-tools@15.27.0 deploy --only hosting:web --project store-collection-app --non-interactive --token "${{ steps.auth.outputs.access_token }}" 2>&1)"
          deploy_status=$?
          if [ "$deploy_status" -ne 0 ]; then
            {
              echo '### Firebase deploy diagnostics'
              echo '```text'
              printf '%s\n' "$deploy_output" | tail -n 80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "$deploy_output"
          exit "$deploy_status"
