name: Deploy web application

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    env:
      AUTH_API_BASE_URL: https://collection-api.alasalh.com
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: >-
          flutter build web --release
          --dart-define=AUTH_API_BASE_URL=${{ env.AUTH_API_BASE_URL }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/385756153909/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-deployer@store-collection-app.iam.gserviceaccount.com
      - run: npx firebase-tools@15.27.0 deploy --only hosting:web --project store-collection-app --non-interactive
